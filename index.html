<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="utility.css" />
    <link rel="stylesheet" href="mediaqueries.css" />
    <head>
      <!-- Font Awesome 6 -->
      <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
      />
    </head>

    <!-- link to Montserrat font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..
32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&
family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Nata+Sans:wght@100..900&
family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;
1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Flex:opsz,
wght@8..144,100..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap
"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container flex">
      <div class="left bg-black">
        <div class="close">
          <i class="fa-solid fa-xmark" style="font-size: 30px"></i>
        </div>
        <div class="home rounded bg-grey p1 m1">
          <ul class="spotifyLogo">
            <li class="flex items-center">
              <img class="invert" src="logo.svg" alt="logo" />Spotify
            </li>
          </ul>
          <div class="sidebar">
            <ul class="home_styling">
              <li class="flex">
                <img class="invert" src="home.svg" alt="home" />Home
              </li>
              <li class="flex">
                <img class="invert" src="search.svg" alt="search" />Search
              </li>
            </ul>
          </div>
        </div>
        <div class="library rounded bg-grey p1 m1">
          <ul class="library_adjustment">
            <li class="flex">
              <img class="invert" src="playlist.svg" alt="playlist" />
              Your library
            </li>
          </ul>
          <div class="songList">
            <ul>
             <li></li>
            </ul>
          </div>

          <div class="footer flex">
            <div class="upperLinks flex">
              <div>
                <a href="https://www.spotify.com/jp/legal/"
                  ><span>Legal</span></a
                >
              </div>
              <div>
                <a href="https://www.spotify.com/jp/privacy/"
                  ><span>Privacy Center</span></a
                >
              </div>
              <div>
                <a href="https://www.spotify.com/jp/legal/privacy-policy/"
                  ><span>Privacy Policy</span></a
                >
              </div>
            </div>
            <div class="lowerLinks flex">
              <div>
                <a href="https://www.spotify.com/jp/legal/cookies-policy/"
                  ><span>Cookies</span></a
                >
              </div>
              <div>
                <a href="https://www.spotify.com/jp/legal/privacy-policy/#s3"
                  ><span>About Ads</span></a
                >
              </div>
              <div>
                <a href="https://www.spotify.com/jp/accessibility/"
                  ><span>Accessibility</span></a
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="right rounded bg-grey">
        <div class="header">
          <div class="navs">
            <div class="hamburgerContainer">
              <div class="hamburger">
                <i class="fa-solid fa-bars" style="font-size: 30px"></i>
              </div>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M15 6L9.70711 11.2929C9.37377 11.6262 9.20711 11.7929 9.20711 12C9.20711 12.2071 9.37377 12.3738 9.70711 12.7071L15 18"
                  stroke="#141B34"
                  class="invert"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M9 18L14.2929 12.7071C14.6262 12.3738 14.7929 12.2071 14.7929 12C14.7929 11.7929 14.6262 11.6262 14.2929 11.2929L9 6"
                  stroke="#141B34"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  class="invert"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
          </div>
          <div class="buttons">
            <button class="signupbtn">Sign up</button>
            <button class="loginbtn">Log in</button>
          </div>
        </div>
        <div class="spotifyPlaylist">
          <h1 style="padding: 26px">Spotify playlists</h1>

          <div class="cardContainer">
            
          </div>
          <div class="aboveplaybar">
            <div class="playbar">
              <div class="seekbar">
                <div class="circle"></div>
              </div>
              <div class="abovebar">
                <div class="songinfo"></div>
                <div class="songbuttons">
                  <i id="previous" class="fa-solid invert fa-backward"></i>
                  <i id="play" class="fa-solid invert fa-circle-play"></i>
                  <i id="next" class="fa-solid invert fa-forward"></i>
                </div>
                <div class="player-controls">
                  <div class="songtime"></div>
                  <div class="volume">
                     <i class="fa-solid fa-volume-high invert"></i>
                    <div class="range">
                      <input type="range" name="volume" id="">
                    </div>
                  
                  </div>
                </div>
              </div>
            </div>
          </div>
          <!-- second div -->
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
